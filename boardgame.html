<style>
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --ink:#1d1d1f;
  --ink-2:#6e6e73;
  --line:rgba(0,0,0,.08);
  --blue:#0071e3;
  --radius:20px;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --shadow-hi:0 14px 40px rgba(0,0,0,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro KR","SF Pro Text","Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
}
button{font-family:inherit;cursor:pointer}

/* ---------- 상단 바 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  background:rgba(245,245,247,.8);border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:10px}
.brand{font-size:15px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .dot{font-size:17px}
.btn{
  border:none;border-radius:980px;padding:8px 16px;font-size:13px;font-weight:500;
  transition:.2s;background:rgba(0,0,0,.06);color:var(--ink);
}
.btn:hover{background:rgba(0,0,0,.12)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#0077ed}
.btn.on{background:var(--ink);color:#fff}
.btn .ico{display:none}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:2px;background:rgba(0,0,0,.06);border-radius:980px;padding:3px;margin-right:8px}
.tab{border:none;background:transparent;border-radius:980px;padding:7px 16px;font-size:13px;font-weight:500;color:var(--ink-2);transition:.2s}
.tab.sel{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.view{display:none}
.view.show{display:block}
.step{display:none}
.step.show{display:block}

/* ---------- 히어로 ---------- */
.hero{max-width:1120px;margin:0 auto;padding:60px 22px 30px;text-align:center}
.hero h1{font-size:clamp(30px,5.4vw,52px);line-height:1.12;font-weight:700;margin:0 0 14px;letter-spacing:-.03em}
.hero p{font-size:clamp(15px,2.2vw,19px);color:var(--ink-2);margin:0 auto;max-width:600px;line-height:1.55}
.hero .edit-field{display:none}
body.editing .hero h1,body.editing .hero p{display:none}
body.editing .hero .edit-field{display:block}

.editbar{
  display:none;max-width:1120px;margin:0 auto 6px;padding:12px 18px;
  background:#fff8e6;border:1px solid #f0dda6;border-radius:14px;
  font-size:13px;color:#7a5c05;line-height:1.5;
}
body.editing .editbar{display:block;margin-bottom:22px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 140px}

/* ---------- 키워드 카드 ---------- */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.card{
  position:relative;background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);border:none;padding:0;text-align:left;width:100%;
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.22,.61,.36,1),box-shadow .3s;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
  box-shadow:inset 0 0 0 0 var(--blue);transition:box-shadow .2s;
}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hi)}
.card.sel::after{box-shadow:inset 0 0 0 2.5px var(--blue)}
.check{
  position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.07);color:transparent;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;transition:.2s;z-index:2;
}
.card.sel .check{background:var(--blue);color:#fff}
body.editing .check{display:none}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;background:#fff}
.emo{
  font-size:60px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.14));
  transition:transform .3s cubic-bezier(.22,.61,.36,1);
}
.card:hover .emo{transform:translateY(-3px) scale(1.06)}
.body{padding:2px 20px 22px;display:flex;flex-direction:column;gap:5px;flex:1;text-align:center;align-items:center}
.body h3{margin:0;font-size:17.5px;font-weight:600;letter-spacing:-.02em}
.body p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.meta{margin-top:auto;padding-top:14px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.card.sel .meta{color:var(--blue)}
.card-tools{position:absolute;top:10px;right:10px;display:none;gap:6px;z-index:3}
body.editing .card-tools{display:flex}
.icon-btn{
  width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:14px;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:#fff}
.add-card{
  border:2px dashed rgba(0,0,0,.18);background:transparent;border-radius:var(--radius);
  min-height:260px;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink-2);font-size:15px;font-weight:500;transition:.2s;
}
body.editing .add-card{display:flex}
.add-card:hover{border-color:var(--blue);color:var(--blue);background:rgba(0,113,227,.04)}
.add-card .plus{font-size:34px;line-height:1}

/* ---------- 하단 선택 바 ---------- */
.selbar{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,220%);z-index:50;
  opacity:0;pointer-events:none;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--line);border-radius:980px;box-shadow:0 12px 40px rgba(0,0,0,.18);
  padding:9px 9px 9px 20px;display:flex;align-items:center;gap:14px;
  transition:transform .32s cubic-bezier(.22,.61,.36,1),opacity .25s;max-width:calc(100% - 32px);
}
.selbar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.selbar .cnt{font-size:14px;font-weight:600;white-space:nowrap}
.selbar .cnt em{color:var(--blue);font-style:normal}
.selbar .btn{padding:10px 20px;font-size:14px}
body.editing .selbar{transform:translate(-50%,220%);opacity:0;pointer-events:none}

/* ---------- 결과 화면 ---------- */
.result{max-width:760px;margin:0 auto;padding:34px 22px 90px}
.backlink{
  background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;
  padding:0;margin-bottom:22px;display:inline-flex;align-items:center;gap:4px;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{
  background:#fff;border:1px solid var(--line);border-radius:980px;padding:7px 14px;
  font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);transition:.2s;color:var(--ink);
}
.chip:hover{border-color:rgba(0,0,0,.2)}
.pickbox{
  background:#fff;border-radius:22px;padding:34px 30px;box-shadow:var(--shadow);text-align:center;
}
.pickbox .from{font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:14px}
.pickbox .q{font-size:22px;font-weight:600;line-height:1.5;letter-spacing:-.02em;min-height:66px;display:flex;align-items:center;justify-content:center}
.pickactions{display:flex;gap:10px;margin-top:24px}
.pickactions .btn{flex:1;padding:13px;font-size:14px}
.group{margin-top:44px}
.group h3{
  font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px;
}
.group h3 .ge{font-size:20px}
.group h3 .n{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-weight:500}
.qlist{margin:0;padding:0;list-style:none;background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.qlist li{
  padding:15px 18px;font-size:14.5px;line-height:1.5;color:var(--ink);cursor:pointer;
  border-bottom:1px solid var(--line);transition:background .15s;
}
.qlist li:last-child{border-bottom:none}
.qlist li:hover{background:#fafafa}
.qlist li.active{font-weight:600;color:var(--blue)}
.empty{text-align:center;color:var(--ink-2);font-size:15px;padding:60px 0}

/* ---------- 모달(카드 편집) ---------- */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:22px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  background:#fff;border-radius:26px;width:min(620px,100%);max-height:86vh;overflow:auto;position:relative;
  transform:translateY(18px) scale(.98);transition:transform .3s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}
.backdrop.open .sheet{transform:none}
.sheet-hero{padding:38px 30px 24px;text-align:center;color:var(--ink);position:relative;background:#fff}
.sheet-hero .big{font-size:58px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.14))}
.sheet-hero h2{margin:14px 0 4px;font-size:23px;font-weight:700;letter-spacing:-.02em}
.sheet-hero .sub{margin:0;font-size:13.5px;color:var(--ink-2)}
.close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(0,0,0,.06);color:var(--ink-2);font-size:15px;line-height:1;z-index:2;
}
.close:hover{background:rgba(0,0,0,.12)}
.sheet-body{padding:6px 30px 30px}

/* ---------- 폼 ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea,.edit-field input,.edit-field textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  font-size:15px;font-family:inherit;color:var(--ink);background:#fff;resize:vertical;
}
.field input:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:12px}
.row .field{flex:1}
.hint{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.edit-field{max-width:620px;margin:0 auto 10px}
.edit-field input{text-align:center;font-size:20px;font-weight:600}
.edit-field textarea{text-align:center;font-size:15px;margin-top:8px}
footer{text-align:center;color:var(--ink-2);font-size:12px;padding:30px 22px 50px;border-top:1px solid var(--line);max-width:1120px;margin:0 auto}
body.deploy .editonly{display:none !important}

/* ---------- 인트로 ---------- */
.intro{max-width:760px;margin:0 auto;padding:70px 22px 90px;text-align:center}
.avatar-wrap{position:relative;display:inline-block}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block;background:linear-gradient(160deg,#e6e6eb,#c9c9d1);box-shadow:0 12px 34px rgba(0,0,0,.16)}
.avatar-ph{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(160deg,#e6e6eb,#c2c2cc);box-shadow:0 12px 34px rgba(0,0,0,.16)}
.photo-tools{display:none;justify-content:center;gap:8px;margin-top:14px}
body.editing .photo-tools{display:flex}
.intro h2{font-size:clamp(26px,4.4vw,38px);font-weight:700;letter-spacing:-.03em;margin:22px 0 6px}
.intro .role{font-size:15px;color:var(--ink-2);margin:0}
.greeting{margin:34px auto 0;max-width:560px;font-size:17px;line-height:1.75;color:#333;white-space:pre-line}
.why{margin-top:64px;text-align:left}
.why h3{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.06em;text-align:center;margin:0 0 22px}
.reasons{display:grid;gap:14px}
.reason{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start}
.reason .re{font-size:28px;line-height:1.2}
.reason h4{margin:0 0 5px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.reason p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.cta{margin-top:44px;display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:980px;padding:14px 30px;font-size:15px;font-weight:500;transition:.2s}
.cta:hover{background:#0077ed;transform:translateY(-1px)}
.intro-edit{display:none;text-align:left;margin-top:40px;background:#fff;border-radius:18px;padding:24px;box-shadow:var(--shadow)}
body.editing .intro-edit{display:block}
body.editing .greeting,body.editing .intro h2,body.editing .intro .role,body.editing .why,body.editing .cta{display:none}

/* ---------- 모바일 ---------- */
@media (max-width:719px){
  .topbar-in{flex-wrap:wrap;padding:9px 16px;gap:8px}
  .brand{font-size:14.5px}
  .topbar-in .btn{width:38px;height:38px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .topbar-in .btn .lbl{display:none}
  .topbar-in .btn .ico{display:block;font-size:15px;line-height:1}
  .tabs{order:5;width:100%;margin:2px 0 0}
  .tab{flex:1 1 0;min-width:0;padding:9px 0;font-size:14px}

  .hero{padding:38px 20px 24px}
  .wrap{padding:0 16px 130px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .thumb{height:100px}
  .emo{font-size:42px}
  .body{padding:2px 10px 16px}
  .body h3{font-size:15px}
  .body p{font-size:12.5px}
  .meta{padding-top:10px;font-size:11.5px}
  .add-card{min-height:190px;grid-column:span 2}
  .check{width:24px;height:24px;top:9px;right:9px;font-size:13px}

  .selbar{
    left:12px;right:12px;bottom:12px;transform:translateY(220%);max-width:none;
    padding:9px 9px 9px 18px;margin-bottom:env(safe-area-inset-bottom,0px);
  }
  .selbar.show{transform:translateY(0)}
  .selbar{gap:8px;padding:8px 8px 8px 16px}
  .selbar .cnt{font-size:13px}
  .selbar .btn{padding:11px 15px;font-size:13.5px;white-space:nowrap;flex:none}
  .selbar #goResult{margin-left:auto}
  body.editing .selbar{transform:translateY(220%)}

  .result{padding:26px 16px 80px}
  .pickbox{padding:26px 20px;border-radius:18px}
  .pickbox .q{font-size:19px;min-height:58px}
  .pickactions{flex-direction:column}
  .qlist li{padding:14px 16px;font-size:14px}

  .backdrop{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-height:92vh;width:100%;transform:translateY(40px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-hero{padding:28px 22px 18px}
  .sheet-hero .big{font-size:48px}
  .sheet-hero h2{font-size:21px}
  .sheet-body{padding:4px 20px 28px}

  .intro{padding:46px 20px 76px}
  .avatar,.avatar-ph{width:108px;height:108px}
  .avatar-ph{font-size:44px}
  .greeting{font-size:15.5px;margin-top:26px}
  .why{margin-top:48px}
  .reason{padding:17px 18px;gap:13px;border-radius:16px}
  .intro-edit{padding:18px}
  .row{flex-direction:column;gap:0}
  .editbar{margin:0 0 16px;font-size:12.5px}
}
</style>
</head>
<body class="">

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot">💬</span> 이야기거리</div>
    <div class="tabs">
      <button class="tab sel" data-tab="intro">인트로</button>
      <button class="tab" data-tab="cards">이야기거리</button>
    </div>
    <button class="btn editonly" id="editToggle" aria-label="편집 모드"><span class="ico">✏️</span><span class="lbl">편집 모드</span></button>
    <button class="btn editonly" id="exportBtn" aria-label="배포용 파일 저장"><span class="ico">⤓</span><span class="lbl">배포용 파일 저장</span></button>
    <button class="btn primary" id="randomBtn" aria-label="아무거나 하나"><span class="ico">🎲</span><span class="lbl">아무거나 하나</span></button>
  </div>
</div>

<!-- ===== 인트로 탭 ===== -->

  <div class="intro">
    <div class="avatar-wrap">
      <img class="avatar" id="avatarImg" alt="프로필 사진" style="display:none">

    </div>

<!-- ===== 이야기거리 탭 ===== -->
<section class="view" id="cardsView">

  <!-- 1단계: 키워드 고르기 -->
  <div class="step show" id="pickStep">
    <div class="hero">
      <h1 id="mainTitle"></h1>

        수정한 내용은 <b>브라우저 메모리에만</b> 있으니, 끝나면 상단의 <b>배포용 파일 저장</b>을 눌러 완성본 HTML을 내려받으세요.

<!-- 카드 편집 모달 -->
<div class="backdrop" id="editModal">
  <div class="sheet">
    <div class="sheet-hero">
      <button class="close" data-close="">✕</button>
      <div class="big" id="editPreview">🔮</div>
      <h2>키워드 편집</h2>
      <p class="sub">이모지 · 이름 · 질문을 자유롭게 바꿔보세요</p>

        <div class="field" style="max-width:110px">
          <label>이모지</label>
          <input id="fEmoji" maxlength="4" style="text-align:center;font-size:22px">
        </div>

      </div>

        <label>질문 목록</label>

        <div class="hint">한 줄 = 질문 하나입니다.</div>
      </div>
      <div class="pickactions">
        <button class="btn primary" id="saveCard">저장</button>
        <button class="btn" data-close="">취소</button>
      </div>

</div>

<!-- 하단 선택 바 -->
<div class="selbar" id="selbar">
  <div class="cnt"><em id="selCount">0</em>개 선택</div>
  <button class="btn" id="clearSel">비우기</button>
  <button class="btn primary" id="goResult">이야기거리 보기</button>
</div>

<script>
(function(){
  "use strict";

  var DEPLOY = document.documentElement.hasAttribute("data-deploy");
  var DATA = JSON.parse(document.getElementById("data-seed").textContent);
  var editing = false, editIndex = -1;
  var selected = [];       // 선택된 카드 인덱스
  var pool = [];           // [{q, ci}]
  var lastPick = -1;

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* ---------- 공통 ---------- */
  function renderHead(){
    $("mainTitle").textContent = DATA.title;
    $("mainSub").textContent = DATA.subtitle;
    $("titleInput").value = DATA.title;
    $("subInput").value = DATA.subtitle;
    document.title = DATA.title;
    $("footNote").textContent = "키워드 " + DATA.cards.length + "개 · 이야기거리 " +
      DATA.cards.reduce(function(n,c){ return n + c.questions.length; },0) + "개";
  }

  function showTab(name){
    var tabs = document.querySelectorAll(".tab");
    for (var i=0;i<tabs.length;i++)
      tabs[i].classList.toggle("sel", tabs[i].getAttribute("data-tab") === name);
    $("introView").classList.toggle("show", name === "intro");
    $("cardsView").classList.toggle("show", name === "cards");
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function showStep(name){
    $("pickStep").classList.toggle("show", name === "pick");
    $("resultStep").classList.toggle("show", name === "result");
    syncSelbar();
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  /* ---------- 1단계: 키워드 선택 ---------- */
  function renderGrid(){
    var g = $("grid");
    g.innerHTML = "";
    DATA.cards.forEach(function(c,i){
      var on = selected.indexOf(i) >= 0;
      var el = document.createElement("div");
      el.className = "card" + (on ? " sel" : "");
      el.innerHTML =
        '<div class="card-tools">' +
          '<button class="icon-btn" data-act="edit" title="수정">✏️</button>' +
          '<button class="icon-btn" data-act="del" title="삭제">🗑️</button>' +
        '</div>' +
        '<div class="check">✓</div>' +
        '<div class="thumb"><span class="emo">' + esc(c.emoji) + '</span></div>' +
        '<div class="body">' +
          '<h3>' + esc(c.title) + '</h3>' +
          '<div class="meta">이야기거리 ' + c.questions.length + '개</div>' +
        '</div>';
      el.addEventListener("click", function(e){
        var act = e.target.getAttribute && e.target.getAttribute("data-act");
        if (act === "edit"){ openEdit(i); return; }
        if (act === "del"){ removeCard(i); return; }
        if (editing) return;
        toggleSelect(i);
      });
      g.appendChild(el);
    });

    var add = document.createElement("button");
    add.className = "add-card";
    add.innerHTML = '<span class="plus">+</span><span>새 키워드 추가</span>';
    add.addEventListener("click", function(){ openEdit(-1); });
    g.appendChild(add);
  }

  function toggleSelect(i){
    var k = selected.indexOf(i);
    if (k >= 0) selected.splice(k,1); else selected.push(i);
    renderGrid();
    syncSelbar();
  }

  function syncSelbar(){
    var onPick = $("pickStep").classList.contains("show") &&
                 $("cardsView").classList.contains("show");
    $("selCount").textContent = selected.length;
    $("selbar").classList.toggle("show", onPick && selected.length > 0 && !editing);
  }

  /* ---------- 2단계: 결과 ---------- */
  function buildPool(){
    pool = [];
    selected.slice().sort(function(a,b){ return a-b; }).forEach(function(ci){
      DATA.cards[ci].questions.forEach(function(q){ pool.push({ q:q, ci:ci }); });
    });
  }

  function renderResult(){
    buildPool();
    lastPick = -1;

    var chips = $("chips");
    chips.innerHTML = "";
    selected.slice().sort(function(a,b){ return a-b; }).forEach(function(ci){
      var c = DATA.cards[ci];
      var b = document.createElement("button");
      b.className = "chip";
      b.innerHTML = '<span>' + esc(c.emoji) + '</span>' + esc(c.title);
      b.addEventListener("click", function(){
        var t = document.getElementById("grp-" + ci);
        if (t) t.scrollIntoView({ behavior:"smooth", block:"start" });
      });
      chips.appendChild(b);
    });

    var box = $("groups");
    box.innerHTML = "";
    if (!pool.length){
      box.innerHTML = '<div class="empty">고른 키워드에 질문이 없어요.<br>편집 모드에서 질문을 추가해 보세요.</div>';
      $("pickFrom").textContent = "";
      $("pickQ").textContent = "—";
      return;
    }

    selected.slice().sort(function(a,b){ return a-b; }).forEach(function(ci){
      var c = DATA.cards[ci];
      var sec = document.createElement("div");
      sec.className = "group";
      sec.id = "grp-" + ci;
      var ul = '<ul class="qlist">';
      c.questions.forEach(function(q,qi){
        ul += '<li data-ci="' + ci + '" data-qi="' + qi + '">' + esc(q) + '</li>';
      });
      ul += "</ul>";
      sec.innerHTML = '<h3><span class="ge">' + esc(c.emoji) + '</span>' + esc(c.title) +
                      '<span class="n">' + c.questions.length + '개</span></h3>' + ul;
      box.appendChild(sec);
    });

    var items = box.querySelectorAll(".qlist li");
    for (var i=0;i<items.length;i++){
      items[i].addEventListener("click", function(){
        var ci = +this.getAttribute("data-ci"), qi = +this.getAttribute("data-qi");
        var idx = -1;
        for (var k=0;k<pool.length;k++){
          if (pool[k].ci === ci && pool[k].q === DATA.cards[ci].questions[qi]){ idx = k; break; }
        }
        showPick(idx < 0 ? 0 : idx);
        $("pickQ").scrollIntoView({ behavior:"smooth", block:"center" });
      });
    }
    pickRandom();
  }

  function showPick(idx){
    lastPick = idx;
    var item = pool[idx];
    $("pickQ").textContent = item.q;
    $("pickFrom").textContent = DATA.cards[item.ci].emoji + "  " + DATA.cards[item.ci].title;
    var items = document.querySelectorAll("#groups .qlist li");
    for (var i=0;i<items.length;i++){
      var ci = +items[i].getAttribute("data-ci"), qi = +items[i].getAttribute("data-qi");
      items[i].classList.toggle("active", ci === item.ci && DATA.cards[ci].questions[qi] === item.q);
    }
  }

  function pickRandom(){
    if (!pool.length) return;
    var idx = Math.floor(Math.random()*pool.length);
    if (pool.length > 1){ while (idx === lastPick) idx = Math.floor(Math.random()*pool.length); }
    showPick(idx);
  }

  /* ---------- 카드 편집 ---------- */
  function openEdit(i){
    editIndex = i;
    var c = i >= 0 ? DATA.cards[i] : { emoji:"✨", title:"", questions:[] };
    $("fEmoji").value = c.emoji;
    $("fTitle").value = c.title;
    $("fQs").value = c.questions.join("\n");
    $("editPreview").textContent = c.emoji;
    $("editModal").classList.add("open");
  }

  function saveCard(){
    var qs = $("fQs").value.split("\n").map(function(s){ return s.trim(); })
                                       .filter(function(s){ return s.length; });
    var c = {
      emoji: $("fEmoji").value.trim() || "✨",
      title: $("fTitle").value.trim() || "새 키워드",
      questions: qs
    };
    if (editIndex >= 0) DATA.cards[editIndex] = c; else DATA.cards.push(c);
    $("editModal").classList.remove("open");
    renderHead(); renderGrid();
  }

  function removeCard(i){
    if (!confirm('"' + DATA.cards[i].title + '" 키워드를 삭제할까요?')) return;
    DATA.cards.splice(i,1);
    selected = selected.filter(function(x){ return x !== i; })
                       .map(function(x){ return x > i ? x-1 : x; });
    renderHead(); renderGrid(); syncSelbar();
  }

  /* ---------- 인트로 ---------- */
  function renderIntro(){
    var it = DATA.intro;
    if (it.photo){
      $("avatarImg").src = it.photo;
      $("avatarImg").style.display = "block";
      $("avatarPh").style.display = "none";
    } else {
      $("avatarImg").removeAttribute("src");
      $("avatarImg").style.display = "none";
      $("avatarPh").style.display = "flex";
    }
    $("introName").textContent = it.name;
    $("introRole").textContent = it.role;
    $("introGreeting").textContent = it.greeting;
    $("whyTitle").textContent = it.whyTitle;
    $("goCards").textContent = it.cta;

    var box = $("reasons");
    box.innerHTML = "";
    it.reasons.forEach(function(r){
      var d = document.createElement("div");
      d.className = "reason";
      d.innerHTML = '<div class="re">' + esc(r.emoji) + '</div>' +
                    '<div><h4>' + esc(r.title) + '</h4><p>' + esc(r.text) + '</p></div>';
      box.appendChild(d);
    });

    $("iName").value = it.name;
    $("iRole").value = it.role;
    $("iGreeting").value = it.greeting;
    $("iWhyTitle").value = it.whyTitle;
    $("iCta").value = it.cta;
    $("iReasons").value = it.reasons.map(function(r){
      return r.emoji + " | " + r.title + " | " + r.text;
    }).join("\n");
  }

  function saveIntro(){
    var it = DATA.intro;
    it.name = $("iName").value.trim() || it.name;
    it.role = $("iRole").value.trim();
    it.greeting = $("iGreeting").value;
    it.whyTitle = $("iWhyTitle").value.trim();
    it.cta = $("iCta").value.trim() || "키워드 고르러 가기";
    it.reasons = $("iReasons").value.split("\n")
      .map(function(s){ return s.trim(); }).filter(function(s){ return s.length; })
      .map(function(line){
        var p = line.split("|").map(function(x){ return x.trim(); });
        return { emoji: p[0] || "•", title: p[1] || "", text: p[2] || "" };
      });
    renderIntro();
    var b = $("saveIntro");
    b.textContent = "저장됨 ✓";
    setTimeout(function(){ b.textContent = "인트로 저장"; }, 1200);
  }

  function handlePhoto(file){
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var S = 512, cv = document.createElement("canvas");
        cv.width = S; cv.height = S;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,S,S);
        var side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
        DATA.intro.photo = cv.toDataURL("image/jpeg", 0.85);
        renderIntro();
      };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(file);
  }

  /* ---------- 배포용 파일 저장 ---------- */
  function exportHTML(){
    DATA.title = $("titleInput").value.trim() || DATA.title;
    DATA.subtitle = $("subInput").value.trim() || DATA.subtitle;

    var clone = document.documentElement.cloneNode(true);
    clone.setAttribute("data-deploy","true");
    clone.querySelector("#data-seed").textContent = "\n" + JSON.stringify(DATA,null,2) + "\n";
    clone.querySelector("#grid").innerHTML = "";
    clone.querySelector("#groups").innerHTML = "";
    clone.querySelector("#chips").innerHTML = "";
    clone.querySelector("#pickQ").textContent = "";
    clone.querySelector("#pickFrom").textContent = "";
    clone.querySelector("#selCount").textContent = "0";
    clone.querySelector("#selbar").className = "selbar";
    clone.querySelector("#mainTitle").textContent = "";
    clone.querySelector("#mainSub").textContent = "";
    clone.querySelector("#footNote").textContent = "";
    clone.querySelector("body").className = "";
    var bd = clone.querySelectorAll(".backdrop");
    for (var i=0;i<bd.length;i++) bd[i].classList.remove("open");
    ["titleInput","subInput","fEmoji","fTitle",
     "iName","iRole","iGreeting","iWhyTitle","iCta","iReasons"].forEach(function(id){
      var n = clone.querySelector("#"+id); if (n) n.removeAttribute("value");
    });
    ["introName","introRole","introGreeting","whyTitle","goCards"].forEach(function(id){
      var n = clone.querySelector("#"+id); if (n) n.textContent = "";
    });
    clone.querySelector("#reasons").innerHTML = "";
    var av = clone.querySelector("#avatarImg");
    av.removeAttribute("src"); av.setAttribute("style","display:none");
    clone.querySelector("#avatarPh").setAttribute("style","");
    clone.querySelector("#introView").className = "view show";
    clone.querySelector("#cardsView").className = "view";
    clone.querySelector("#pickStep").className = "step show";
    clone.querySelector("#resultStep").className = "step";
    var tb = clone.querySelectorAll(".tab");
    for (var t=0;t<tb.length;t++)
      tb[t].classList.toggle("sel", tb[t].getAttribute("data-tab") === "intro");

    var html = "<!DOCTYPE html>\n" + clone.outerHTML;
    var blob = new Blob([html], {type:"text/html;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "icebreaker-published.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  }

  /* ---------- 이벤트 ---------- */
  $("editToggle").addEventListener("click", function(){
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    this.classList.toggle("on", editing);
    this.querySelector(".lbl").textContent = editing ? "편집 끝내기" : "편집 모드";
    this.setAttribute("aria-label", editing ? "편집 끝내기" : "편집 모드");
    if (editing && $("resultStep").classList.contains("show")) showStep("pick");
    if (!editing){
      DATA.title = $("titleInput").value.trim() || DATA.title;
      DATA.subtitle = $("subInput").value.trim() || DATA.subtitle;
      renderHead();
    }
    syncSelbar();
  });
  $("exportBtn").addEventListener("click", exportHTML);

  // 아무거나 하나: 고른 키워드가 없으면 전체에서 뽑습니다
  $("randomBtn").addEventListener("click", function(){
    if (editing) return;
    if (!selected.length) selected = DATA.cards.map(function(_,i){ return i; });
    showTab("cards");
    renderGrid();
    renderResult();
    showStep("result");
  });

  $("goResult").addEventListener("click", function(){
    if (!selected.length) return;
    renderResult();
    showStep("result");
  });
  $("clearSel").addEventListener("click", function(){
    selected = [];
    renderGrid(); syncSelbar();
  });
  $("backBtn").addEventListener("click", function(){ showStep("pick"); });
  $("nextQ").addEventListener("click", pickRandom);
  $("copyQ").addEventListener("click", function(){
    var t = $("pickQ").textContent, self = this;
    function done(){ self.textContent = "복사됨 ✓"; setTimeout(function(){ self.textContent = "질문 복사"; },1200); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); done();
    }
  });
  $("saveCard").addEventListener("click", saveCard);
  $("fEmoji").addEventListener("input", function(){ $("editPreview").textContent = this.value || "✨"; });

  var tabEls = document.querySelectorAll(".tab");
  for (var t=0;t<tabEls.length;t++){
    tabEls[t].addEventListener("click", function(){ showTab(this.getAttribute("data-tab")); syncSelbar(); });
  }
  $("goCards").addEventListener("click", function(){ showTab("cards"); syncSelbar(); });
  $("saveIntro").addEventListener("click", saveIntro);
  $("photoBtn").addEventListener("click", function(){ $("photoInput").click(); });
  $("photoInput").addEventListener("change", function(){ handlePhoto(this.files[0]); this.value=""; });
  $("photoClear").addEventListener("click", function(){ DATA.intro.photo = ""; renderIntro(); });

  document.addEventListener("click", function(e){
    if (e.target.hasAttribute && e.target.hasAttribute("data-close")){
      e.target.closest(".backdrop").classList.remove("open");
    }
  });
  var backs = document.querySelectorAll(".backdrop");
  for (var b=0;b<backs.length;b++){
    backs[b].addEventListener("click", function(e){
      if (e.target === this) this.classList.remove("open");
    });
  }
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      var open = document.querySelectorAll(".backdrop.open");
      for (var i=0;i<open.length;i++) open[i].classList.remove("open");
    }
  });

  if (DEPLOY) document.body.classList.add("deploy");
  renderHead();
  renderIntro();
  renderGrid();
})();
</script>


</body></html>
